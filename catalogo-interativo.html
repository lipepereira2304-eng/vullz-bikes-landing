<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Catálogo Interativo | Vullz Bikes</title>
    <meta
      name="description"
      content="Mostruário digital das bicicletas Vullz Bikes. Navegue pelos modelos e cores."
    />
    <!--
      Branco, e não o grafite da home: `theme-color` pinta a barra de status do
      navegador no celular, e esta página tem fundo branco. Com o valor da home
      o topo do aparelho ficava grafite encostado numa página branca, como se
      faltasse carregar alguma coisa. Navegadores de desktop ignoram esta meta.
    -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, follow" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/scripts/catalogo-interativo.ts"></script>
  </body>
</html>
